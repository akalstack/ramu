<!doctype html>
<!--
  Source for public/og.png (1200x630 link preview for WhatsApp, Slack, X, LinkedIn...).
  Render from apps/site:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
      --allow-file-access-from-files --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=2000 \
      --screenshot=public/og.png scripts/og.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #131315;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
      }
      .glow {
        position: absolute;
        width: 820px;
        height: 820px;
        right: -260px;
        top: -220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(118, 82, 212, 0.4) 0%, rgba(118, 82, 212, 0.1) 45%, transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 75% 30%, #000 0%, transparent 65%);
      }
      .logo {
        position: relative;
        height: 64px;
        width: auto;
        align-self: flex-start;
      }
      h1 {
        position: relative;
        margin-top: auto;
        font-size: 84px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      h1 .grad {
        background: linear-gradient(100deg, #7d6cff 0%, #d9d2ff 45%, #8f7cf0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        position: relative;
        margin-top: 20px;
        font-size: 30px;
        line-height: 1.3;
        color: #a1a1a8;
        max-width: 34ch;
      }
      .foot {
        position: relative;
        margin-top: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .providers {
        display: flex;
        align-items: center;
        gap: 22px;
        color: #a1a1a8;
        font-size: 22px;
        font-weight: 500;
      }
      .providers img {
        height: 34px;
        width: 34px;
        object-fit: contain;
        filter: brightness(0) invert(0.82);
      }
      .url {
        font-size: 28px;
        font-weight: 600;
      }
      .url b {
        color: #7d6cff;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <img class="logo" src="../public/ramu-logo.svg" alt="" />
    <h1>Describe it.<br /><span class="grad">Ramu ships it.</span></h1>
    <p class="sub">Your coding agents build the app, put it online and keep it running. On accounts you own.</p>
    <div class="foot">
      <div class="providers">
        <img src="../../web/src/assets/providers/claude.svg" alt="" />
        <img src="../../web/src/assets/providers/openai.svg" alt="" />
        <img src="../../web/src/assets/providers/opencode.svg" alt="" />
        <img src="../../web/src/assets/providers/cursor.svg" alt="" />
        <img src="../../web/src/assets/providers/antigravity.svg" alt="" />
      </div>
      <span class="url">getramu<b>.</b>dev</span>
    </div>
  </body>
</html>
