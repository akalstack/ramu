nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
# The Claude SDK platform tarball is ~100 MB; allow slow connections to finish.
fetchTimeout: 600000
# Versions used by more than one workspace package.
catalog:
  '@anthropic-ai/claude-agent-sdk': 0.3.327
  '@types/luxon': ^3.7.6
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  electron: 45.3.4
  luxon: ^3.7.2
  node-pty: 1.1.0
  react: 19.3.0
  react-dom: 19.3.0
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  three: 0.187.0
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.1
  zod: 4.6.7
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  react-native-enriched-markdown: true
patchedDependencies:
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
# Patched transitive versions (pnpm audit).
overrides:
  dompurify: '>=3.4.17'
  body-parser: '>=2.4.0'
  node-forge: '>=1.4.1'
  fast-uri: '>=3.1.9'
  katex: '>=0.18.2'
