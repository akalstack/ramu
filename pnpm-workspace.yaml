nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
# The Claude SDK platform tarball is ~100 MB; allow slow connections to finish.
fetchTimeout: 600000
# Versions used by more than one workspace package.
catalog:
  '@anthropic-ai/claude-agent-sdk': 0.3.295
  '@types/luxon': ^3.7.6
  '@types/node': ^24.19.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  electron: 44.7.0
  luxon: ^3.7.2
  node-pty: 1.1.0
  react: 19.3.0
  react-dom: 19.3.0
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  typescript: 5.9.3
  vite: 7.3.7
  vitest: 5.0.3
  zod: 4.6.6
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk@0.3.295'
  - lucide-react@1.54.0
  - '@opencode/client@2.0.30'
  - '@opencode/protocol@2.0.30'
  - '@opencode/schema@2.0.30'
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo@58.0.19
  - '@expo/ui@58.0.23'
  - expo-dev-client@58.0.15
  - expo-dev-launcher@58.0.15
  - expo-glass-effect@58.0.5
  - expo-router@58.0.26
  - expo-widgets@58.0.23
  - node-forge@1.4.1
patchedDependencies:
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
# Patched transitive versions (pnpm audit).
overrides:
  dompurify: '>=3.4.17'
  body-parser: '>=2.4.0'
  node-forge: '>=1.4.1'
  fast-uri: '>=3.1.9'
  katex: '>=0.18.2'
