nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
# The Claude SDK platform tarball is ~100 MB; allow slow connections to finish.
fetchTimeout: 600000
# Versions used by more than one workspace package.
catalog:
  '@anthropic-ai/claude-agent-sdk': 0.3.295
  '@types/luxon': ^3.7.6
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  electron: 44.7.0
  luxon: ^3.7.2
  node-pty: 1.1.0
  react: 19.3.0
  react-dom: 19.3.0
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  typescript: 5.9.3
  vite: 7.3.7
  vitest: 5.0.3
  zod: 4.6.5
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.295'
  - '@anthropic-ai/claude-agent-sdk@0.3.295'
  - lucide-react@1.54.0
  - expo-constants@57.0.22
  - expo-notifications@57.0.23
  - '@expo/ui@57.0.24'
  - expo-widgets@57.0.25
  - '@opencode/client@2.0.30'
  - '@opencode/protocol@2.0.30'
  - '@opencode/schema@2.0.30'
patchedDependencies:
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch
