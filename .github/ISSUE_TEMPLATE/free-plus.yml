name: Free Ramu Plus
description: Ask for Ramu Link Plus at no cost as an open-source maintainer or a student.
labels: [free-plus]
body:
  - type: markdown
    attributes:
      value: A person reads each request; there is no automated check. Do not post anything you would not want public.
  - type: input
    id: account
    attributes:
      label: Ramu Link account email
      description: The Google or GitHub email you signed in to Ramu Link with. Sign in once first so the account exists.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: I am
      options:
        - An open-source maintainer
        - A student
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Project or school
      description: A repository you maintain, or the school you attend.
    validations:
      required: true
