version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for everything that should not break; majors still come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo SDK 58 decides these versions; move them with `npx expo install --fix` when Expo releases.
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-keyboard-controller
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-worklets
      # Node types follow the Node LTS in .node-version.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
