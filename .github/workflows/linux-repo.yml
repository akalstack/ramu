name: Linux repositories
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release whose .deb and .rpm files the repositories should offer
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: linux-repo
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      # The site deploys from here once a Cloudflare token is saved; until then the next manual deploy serves the indexes.
      DEPLOY_SITE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check whether the indexes already offer this release
        run: |
          if grep -q "^Filename: pool/$TAG/" apps/site/public/apt/dists/stable/main/binary-amd64/Packages 2>/dev/null; then
            echo "BUILD_INDEXES=false" >> "$GITHUB_ENV"
          else
            echo "BUILD_INDEXES=true" >> "$GITHUB_ENV"
          fi
      - name: Install repository tools
        if: env.BUILD_INDEXES == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c
      - name: Import the signing key
        if: env.BUILD_INDEXES == 'true'
        env:
          LINUX_REPO_GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
        run: |
          printf '%s\n' "$LINUX_REPO_GPG_KEY" | gpg --batch --import
          echo "RAMU_REPO_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build the APT and DNF indexes
        if: env.BUILD_INDEXES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/linux-repo.sh "$TAG" apps/site/public
      - name: Commit the indexes, so every site deploy serves them
        if: env.BUILD_INDEXES == 'true'
        run: |
          git add apps/site/public/apt apps/site/public/rpm
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(site): Linux repositories offer $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/setup-node@v7
        if: env.DEPLOY_SITE == 'true'
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        if: env.DEPLOY_SITE == 'true'
      - name: Deploy getramu.dev
        if: env.DEPLOY_SITE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ramu/site run deploy
