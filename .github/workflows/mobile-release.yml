name: Mobile release
# Builds the phone app on Expo's build service and hands each build to its store: iOS to App Store Connect (TestFlight;
# going public still means submitting the version for review there), Android to Google Play's open testing track,
# released to testers as soon as Google has processed it. The builds run on Expo, so this job only starts them.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build and submit
        type: choice
        options: [all, ios, android]
        default: all
permissions:
  contents: read
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository secret to release the phone app."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Build and submit
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: npx --yes eas-cli@27.11.0 build --profile production --platform "$PLATFORM" --auto-submit --non-interactive --no-wait
