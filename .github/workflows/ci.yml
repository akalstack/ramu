name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install ripgrep
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ripgrep; else brew install ripgrep; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # One desktop startup smoke test uses an isolated profile and simulated providers.
      - if: runner.os == 'macOS'
        run: pnpm test:desktop-smoke
      # On Linux the same smoke runs against the packaged app, installed from its .deb.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot dpkg && pnpm make --arch=x64
      - if: runner.os == 'Linux'
        run: scripts/smoke/linux-deb-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ matrix.os }}
          path: output/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 7
